name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check report calculations
        run: node --test tests/report-reference.test.mjs src/content/dashboard/model.test.mjs
      - name: Verify static bundle
        run: node deploy/verify-pages-bundle.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
